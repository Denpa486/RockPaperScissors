<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>石头剪刀升龙拳 - Boss Rush 合作版</title>
<style>
  :root {
    --bg: #0a0a0f;
    --text: #e0e0e0;
    --accent1: #4ec9ff;
    --accent2: #ff6b6b;
    --gold: #ffc107;
    --green: #34d399;
    /* 阶段氛围主题变量（由 JS 更新） */
    --theme-accent: #4ec9ff;
    --theme-edge-top: rgba(78,201,255,0.13);
    --theme-edge-bottom: rgba(78,201,255,0.07);
    --theme-vignette: rgba(16,26,46,0.45);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); font-family: 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; overflow: hidden; height: 100vh; }
  #game-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #ui-overlay { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
  /* 全屏渐晕层 + 上下氛围光带 */
  #vignette { position: fixed; inset: 0; pointer-events: none; z-index: 6; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, var(--theme-vignette) 100%); transition: background 0.6s ease; }
  .edge-band { position: fixed; left: 0; right: 0; height: 70px; pointer-events: none; z-index: 6; }
  .edge-band.top { top: 0; background: linear-gradient(to bottom, var(--theme-edge-top), rgba(0,0,0,0)); }
  .edge-band.bottom { bottom: 0; background: linear-gradient(to top, var(--theme-edge-bottom), rgba(0,0,0,0)); }
  /* 阶段横幅脉冲 */
  #phase-indicator[data-pulse="on"] { animation: bannerPulse 0.8s infinite; }
  @keyframes bannerPulse { 0%,100% { box-shadow: 0 0 0 0 var(--theme-accent); } 50% { box-shadow: 0 0 18px 3px var(--theme-accent); } }

  #top-hud { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; padding: 10px 18px; z-index: 10; pointer-events: none; }
  .title { font-size: 20px; font-weight: 800; letter-spacing: 2px; background: linear-gradient(135deg, var(--accent1), var(--gold), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  #phase-indicator { font-size: 15px; font-weight: 700; letter-spacing: 2px; padding: 6px 18px; border-radius: 6px; border: 1px solid #ffffff22; }
  .phase-waiting  { background: #12121a; color: #888; }
  .phase-select   { background: #1a3a5c; color: var(--accent1); border-color: #4ec9ff44; }
  .phase-execute  { background: #2a1a3a; color: #c084fc; border-color: #c084fc44; }
  .phase-boss     { background: #3a1a1a; color: var(--accent2); border-color: #ff6b6b44; animation: pulse 0.8s infinite; }
  .phase-resolve  { background: #3a2a0a; color: var(--gold); border-color: #ffc10744; }
  .phase-roundend { background: #1a1a3a; color: #a78bfa; border-color: #a78bfa44; }
  .phase-gameover { background: #2a2a0a; color: var(--gold); border-color: #ffc10744; }
  .phase-victory  { background: #0a2a1a; color: var(--green); border-color: #34d39944; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  #round-indicator { font-size: 14px; color: #999; letter-spacing: 1px; }

  #boss-hp-wrap { position: fixed; top: 52px; left: 50%; transform: translateX(-50%); width: min(560px, 70vw); z-index: 10; pointer-events: none; display: flex; align-items: center; gap: 10px; }
  #boss-hp-label { color: var(--accent2); font-weight: 700; font-size: 13px; letter-spacing: 1px; }
  #boss-hp-bar { flex: 1; height: 14px; border-radius: 7px; background: #1a1a22; border: 1px solid #ff6b6b33; overflow: hidden; }
  #boss-hp-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #ff6b6b, #ffc107); transition: width 0.4s ease; }
  #boss-hp-text { color: #ffb3b3; font-size: 12px; font-weight: 600; min-width: 42px; text-align: right; }

  #players-hud { position: fixed; bottom: 0; left: 0; right: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 4px 10px; z-index: 10; pointer-events: none; }
  .p-hud { background: rgba(14,14,24,0.88); border: 1px solid #ffffff14; border-radius: 8px; padding: 4px 8px; min-height: 42px; transition: all 0.3s; }
  .p-hud.inactive { opacity: 0.25; }
  .p-hud.dead { opacity: 0.4; filter: grayscale(0.9); }
  .p-hud.locked { border-color: var(--green); box-shadow: 0 0 12px rgba(52,211,153,0.3); }
  .p-hud-row1 { display: flex; align-items: center; justify-content: space-between; }
  .p-name { font-weight: 800; font-size: 14px; letter-spacing: 1px; }
  .p-status { font-size: 11px; color: #aaa; }
  .p-status.attack { color: var(--accent2); font-weight: 700; }
  .p-status.guard  { color: var(--accent1); font-weight: 700; }
  .p-status.dodge  { color: var(--green); font-weight: 700; }
  .p-hp-wrap { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
  .p-hp-bar { flex: 1; height: 9px; border-radius: 4px; background: #1a1a22; overflow: hidden; }
  .p-hp-fill { height: 100%; background: linear-gradient(90deg, #34d399, #4ec9ff); transition: width 0.3s; }
  .p-hp-text { font-size: 11px; color: #ccc; font-weight: 600; min-width: 24px; }
  /* 技能卡：显示在血条上方，更醒目 */
  .p-movecards { display: flex; gap: 6px; margin-bottom: 6px; }
  .move-card { position: relative; width: 56px; height: 56px; border-radius: 10px; border: 2px dashed #ffffff2e; background: rgba(255,255,255,0.03); display: inline-flex; flex-direction: column; align-items: center; justify-content: center; transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1); }
  .move-card .mc-icon { font-size: 26px; line-height: 1; filter: grayscale(0.6); opacity: 0.4; }
  .move-card .mc-label { font-size: 9px; color: #aaa; margin-top: 2px; }
  .move-card[data-state="filled"], .move-card[data-state="locked"] { border-style: solid; border-color: var(--theme-accent, #4ec9ff); background: rgba(255,255,255,0.08); box-shadow: 0 0 10px var(--theme-accent, #4ec9ff); }
  .move-card[data-state="filled"] .mc-icon, .move-card[data-state="locked"] .mc-icon { filter: none; opacity: 1; }
  .move-card[data-state="locked"] { border-color: #ffd84d; box-shadow: 0 0 14px rgba(255,216,77,0.6); }
  .move-card[data-state="locked"] .mc-label { color: #ffd84d; }
  .move-card[data-state="locked"]::after { content: '🔒'; position: absolute; top: -5px; right: -5px; font-size: 12px; }
  @keyframes cardPop { 0% { transform: scale(0.6); opacity: 0; } 60% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  .move-card.pop { animation: cardPop 0.25s cubic-bezier(0.34,1.56,0.64,1); }
  @keyframes cardGlow { 0%,100% { box-shadow: 0 0 6px rgba(255,216,77,0.4); } 50% { box-shadow: 0 0 18px rgba(255,216,77,0.9); } }
  .move-card.locking { animation: cardGlow 0.4s 2; }

  #controls { position: fixed; bottom: 84px; right: 14px; display: flex; flex-direction: column; gap: 6px; z-index: 10; }
  .btn { font-size: 13px; padding: 8px 16px; border-radius: 6px; border: 1px solid #555; background: #12121ae6; color: #ccc; cursor: pointer; letter-spacing: 1px; transition: all 0.2s; pointer-events: auto; }
  .btn:hover { border-color: var(--accent1); color: var(--accent1); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  #message-box { position: fixed; top: 46%; left: 50%; transform: translate(-50%,-50%); font-size: 26px; font-weight: 800; letter-spacing: 3px; color: #fff; text-align: center; z-index: 8; text-shadow: 0 0 24px rgba(0,0,0,0.9),0 2px 8px rgba(0,0,0,0.8); pointer-events: none; transition: opacity 0.3s; white-space: pre-line; max-width: 90vw; line-height: 1.5; }
  #message-box.small { font-size: 15px; color: #ddd; letter-spacing: 1px; }
  #camera-video { position: fixed; left: 14px; top: 60px; width: 240px; height: 180px; object-fit: cover; border-radius: 10px; border: 1px solid #ffffff33; background: #000; transform: scaleX(-1); opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 9; }
  #camera-video.on { opacity: 0.95; }
  #demo-hint { position: fixed; bottom: 84px; left: 14px; font-size: 11px; color: #888; z-index: 10; pointer-events: none; }
  #pose-debug { position: fixed; left: 12px; bottom: 64px; width: 248px; padding: 8px 10px; background: rgba(8,10,18,0.74); border: 1px solid #ffffff22; border-radius: 10px; z-index: 9; pointer-events: none; font-family: Consolas,'Courier New',monospace; display: none; }
  #pose-debug-title { font-size: 11px; color: #8be9fd; letter-spacing: 1px; font-weight: 700; margin-bottom: 2px; }
  #pose-debug-move { font-size: 16px; font-weight: 800; color: #fff; margin-bottom: 6px; }
  #pose-debug-canvas { display: block; width: 220px; height: 150px; margin: 0 auto 6px; }
  #pose-debug-coords { font-size: 10px; line-height: 1.55; color: #c3ccd8; white-space: pre; }

</style>
</head>
<body>
<canvas id="game-canvas"></canvas>
<canvas id="ui-overlay"></canvas>
<div id="vignette"></div>
<div class="edge-band top"></div>
<div class="edge-band bottom"></div>

<div id="top-hud">
  <span class="title">🪨✂️ 石头剪刀升龙拳 · Boss Rush</span>
  <span id="phase-indicator" class="phase-waiting">⏳ 等待开始</span>
  <span id="round-indicator">回合 0</span>
</div>

<div id="boss-hp-wrap">
  <span id="boss-hp-label">👹 BOSS</span>
  <div id="boss-hp-bar"><div id="boss-hp-fill"></div></div>
  <span id="boss-hp-text">20/20</span>
</div>

<div id="players-hud">
  <div class="p-hud inactive" id="hud-0"><div class="p-movecards"><span class="move-card" data-state="empty"><span class="mc-icon"></span><span class="mc-label">未选</span></span><span class="move-card" data-state="empty"><span class="mc-icon"></span><span class="mc-label">未选</span></span></div><div class="p-hud-row1"><span class="p-name" style="color:#4ec9ff;">P1</span><span class="p-status">未就位</span></div><div class="p-hp-wrap"><div class="p-hp-bar"><div class="p-hp-fill" style="width:100%"></div></div><span class="p-hp-text">10</span></div></div>
  <div class="p-hud inactive" id="hud-1"><div class="p-movecards"><span class="move-card" data-state="empty"><span class="mc-icon"></span><span class="mc-label">未选</span></span><span class="move-card" data-state="empty"><span class="mc-icon"></span><span class="mc-label">未选</span></span></div><div class="p-hud-row1"><span class="p-name" style="color:#69f0ae;">P2</span><span class="p-status">未就位</span></div><div class="p-hp-wrap"><div class="p-hp-bar"><div class="p-hp-fill" style="width:100%"></div></div><span class="p-hp-text">10</span></div></div>
  <div class="p-hud inactive" id="hud-2"><div class="p-movecards"><span class="move-card" data-state="empty"><span class="mc-icon"></span><span class="mc-label">未选</span></span><span class="move-card" data-state="empty"><span class="mc-icon"></span><span class="mc-label">未选</span></span></div><div class="p-hud-row1"><span class="p-name" style="color:#ffc107;">P3</span><span class="p-status">未就位</span></div><div class="p-hp-wrap"><div class="p-hp-bar"><div class="p-hp-fill" style="width:100%"></div></div><span class="p-hp-text">10</span></div></div>
  <div class="p-hud inactive" id="hud-3"><div class="p-movecards"><span class="move-card" data-state="empty"><span class="mc-icon"></span><span class="mc-label">未选</span></span><span class="move-card" data-state="empty"><span class="mc-icon"></span><span class="mc-label">未选</span></span></div><div class="p-hud-row1"><span class="p-name" style="color:#8b5cf6;">P4</span><span class="p-status">未就位</span></div><div class="p-hp-wrap"><div class="p-hp-bar"><div class="p-hp-fill" style="width:100%"></div></div><span class="p-hp-text">10</span></div></div>
</div>

<div id="controls">
  <button class="btn" id="camera-btn">🎥 开启摄像头</button>
  <button class="btn" id="start-btn">▶ 开始游戏</button>
</div>

<div id="message-box">点击「开始游戏」，或开启摄像头后自动开始</div>
<div id="demo-hint">演示模式：加 ?demo 参数自动模拟</div>

<div id="pose-debug">
  <div id="pose-debug-title">🦴 骨骼捕捉</div>
  <div id="pose-debug-move">— 未识别</div>
  <canvas id="pose-debug-canvas" width="220" height="150"></canvas>
  <div id="pose-debug-coords">未检测到骨骼</div>
</div>

<video id="camera-video" autoplay playsinline muted></video>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1675466124/drawing_utils.js" crossorigin="anonymous"></script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js';

// ═══════════════════════════════════════════════════════════
//  常量与数据表
// ═══════════════════════════════════════════════════════════
const MAX_HP_PLAYER = 10;
const MAX_HP_BOSS = 20;
const MAX_PLAYERS = 4;
const COMBO_LEN = 2;
const SELECT_MS = 5000;
const EXECUTE_MS = 2400;
const BOSS_WARN_MS = 5000;
const ROUND_END_MS = 2200;
const GESTURE_HOLD_MS = 800;
const RECONFIRM_MS = 1000;
const LANE_STEP = 4.0; // = 轨道间距（加宽后），倾斜一次正好切到下一条轨道中心
const WORLD_SHIFT_X = 1.5; // 轨道组中心在世界 +X（=屏幕左侧），Boss 留在世界中心（画面中央消失点）

const MOVE = { STONE:0, SCISSORS:1, DRAGON:2, PASS:3 };
const MOVES = {
  [MOVE.STONE]:    { key:'STONE', name:'石头·守', icon:'🪨', type:'guard',  damage:0, color:'#4ec9ff' },
  [MOVE.SCISSORS]: { key:'SCISSORS', name:'剪刀·刺', icon:'✂️', type:'attack', damage:1, color:'#69f0ae' },
  [MOVE.DRAGON]:   { key:'DRAGON', name:'升龙拳', icon:'🐉', type:'attack', damage:2, color:'#ffc107' },
  [MOVE.PASS]:     { key:'PASS', name:'不出招', icon:'🚫', type:'pass', damage:0, color:'#8b5cf6' },
};
const MOVE_NAMES = [MOVE.STONE,MOVE.SCISSORS,MOVE.DRAGON,MOVE.PASS].map(id=>MOVES[id].name);
const MOVE_ICONS = [MOVE.STONE,MOVE.SCISSORS,MOVE.DRAGON,MOVE.PASS].map(id=>MOVES[id].icon);

const BOSS_ATTACK = { MELEE:0, RANGED:1 };
const BOSS_MELEE_DMG = 3;
const BOSS_RANGED_DMG = 2;
const BOSS_RANGED_GUARDED = 1;
const COUNTER_DMG = 1;
const MELEE_RADIUS = 3.5;   // 近战预警矩形视觉半宽（5.0×1.4/2），攻击判定与画面完全一致
const RANGED_RADIUS = 2.8;  // 远程预警红圈视觉外半径（1.0 × 2.8），攻击判定局限在圈内
const DEFEND_MIN_FRAMES = 4; // 防御姿势需在预警期间累计至少 4 帧才判定有效，防抖动误判

const PHASE = { WAITING:0, SELECT:1, EXECUTE:2, BOSS_ATTACK:3, RESOLVE:4, ROUND_END:5, GAMEOVER:6, VICTORY:7 };

// ═══════════════════════════════════════════════════════════
//  招式动画系统数据
// ═══════════════════════════════════════════════════════════
const EASING = {
  easeInQuad: t => t*t,
  easeOutQuad: t => t*(2-t),
  easeOutBack: t => { const c1=1.70158, c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); },
  easeInOutSine: t => -(Math.cos(Math.PI*t)-1)/2,
};

function qFromEuler(x,y,z) {
  return new THREE.Quaternion().setFromEuler(new THREE.Euler(x,y,z,'XYZ'));
}

// 人形白盒关节名
const JOINTS = {
  ROOT:'root', HIPS:'hips', SPINE:'spine', CHEST:'chest',
  NECK:'neck', HEAD:'head',
  L_CLAVICLE:'lClavicle', L_SHOULDER:'lShoulder', L_ELBOW:'lElbow', L_WRIST:'lWrist', L_HAND:'lHand',
  R_CLAVICLE:'rClavicle', R_SHOULDER:'rShoulder', R_ELBOW:'rElbow', R_WRIST:'rWrist', R_HAND:'rHand',
  L_HIP:'lHip', L_KNEE:'lKnee', L_ANKLE:'lAnkle', L_FOOT:'lFoot',
  R_HIP:'rHip', R_KNEE:'rKnee', R_ANKLE:'rAnkle', R_FOOT:'rFoot',
};

// 姿态：每个关节的局部旋转（Quaternion）
function makePose(obj) {
  const p = {};
  for (const k in JOINTS) {
    const j = JOINTS[k];
    if (obj[j]) p[j] = obj[j].clone();
    else p[j] = new THREE.Quaternion();
  }
  return p;
}

// 关键帧：局部旋转，单位弧度
const POSE_IDLE = makePose({
  [JOINTS.L_CLAVICLE]: qFromEuler(0,0,0.10),
  [JOINTS.R_CLAVICLE]: qFromEuler(0,0,-0.10),
  [JOINTS.L_SHOULDER]: qFromEuler(0,0,0.08),
  [JOINTS.R_SHOULDER]: qFromEuler(0,0,-0.08),
  [JOINTS.L_ELBOW]: qFromEuler(0,0,0.10),
  [JOINTS.R_ELBOW]: qFromEuler(0,0,-0.10),
});

const POSE_SCISSORS = {
  WINDUP: makePose({
    [JOINTS.R_SHOULDER]: qFromEuler(0,0,-0.35), [JOINTS.R_ELBOW]: qFromEuler(0,0,-1.55),
    [JOINTS.R_WRIST]: qFromEuler(0,0,0),
    [JOINTS.L_SHOULDER]: qFromEuler(0,0,0.25), [JOINTS.L_ELBOW]: qFromEuler(0,0,0.75),
  }),
  STRIKE: makePose({
    [JOINTS.R_SHOULDER]: qFromEuler(0,0,-1.58), [JOINTS.R_ELBOW]: qFromEuler(0,0,0),
    [JOINTS.R_WRIST]: qFromEuler(0,0,0),
    [JOINTS.L_SHOULDER]: qFromEuler(0,0,0.25), [JOINTS.L_ELBOW]: qFromEuler(0,0,0.75),
  }),
  RECOVER: POSE_IDLE,
};

const POSE_DRAGON = {
  WINDUP: makePose({
    [JOINTS.R_SHOULDER]: qFromEuler(0,0,-0.20), [JOINTS.R_ELBOW]: qFromEuler(0,0,-0.80),
    [JOINTS.R_WRIST]: qFromEuler(0,0,0),
    [JOINTS.L_SHOULDER]: qFromEuler(0,0,0.20), [JOINTS.L_ELBOW]: qFromEuler(0,0,0.80),
  }),
  STRIKE: makePose({
    [JOINTS.R_SHOULDER]: qFromEuler(0,0,-2.79), [JOINTS.R_ELBOW]: qFromEuler(0,0,-0.50),
    [JOINTS.R_WRIST]: qFromEuler(0,0,0),
    [JOINTS.L_SHOULDER]: qFromEuler(0,0,0.20), [JOINTS.L_ELBOW]: qFromEuler(0,0,0.80),
  }),
  RECOVER: POSE_IDLE,
};

const POSE_ROCK = {
  WINDUP: makePose({
    [JOINTS.L_SHOULDER]: qFromEuler(0,0,0.55), [JOINTS.L_ELBOW]: qFromEuler(0,0,0.35),
    [JOINTS.R_SHOULDER]: qFromEuler(0,0,-0.55), [JOINTS.R_ELBOW]: qFromEuler(0,0,-0.35),
    [JOINTS.CHEST]: qFromEuler(0.05,0,0),
  }),
  STRIKE: makePose({
    [JOINTS.L_SHOULDER]: qFromEuler(0,0,0.80), [JOINTS.L_ELBOW]: qFromEuler(0.40,0.40,1.25),
    [JOINTS.R_SHOULDER]: qFromEuler(0,0,-0.80), [JOINTS.R_ELBOW]: qFromEuler(0.40,-0.40,-1.25),
    [JOINTS.L_WRIST]: qFromEuler(0.10,0,0), [JOINTS.R_WRIST]: qFromEuler(0.10,0,0),
    [JOINTS.CHEST]: qFromEuler(0.10,0,0),
  }),
  RECOVER: POSE_IDLE,
};

const MOVE_CLIPS = {
  scissors: { frames:[ {name:'WINDUP', pose:POSE_SCISSORS.WINDUP, duration:0.20, ease:EASING.easeInQuad}, {name:'STRIKE', pose:POSE_SCISSORS.STRIKE, duration:0.15, ease:EASING.easeOutBack}, {name:'RECOVER', pose:POSE_SCISSORS.RECOVER, duration:0.35, ease:EASING.easeInOutSine} ] },
  dragon:   { frames:[ {name:'WINDUP', pose:POSE_DRAGON.WINDUP,   duration:0.20, ease:EASING.easeInQuad}, {name:'STRIKE', pose:POSE_DRAGON.STRIKE,   duration:0.15, ease:EASING.easeOutBack}, {name:'RECOVER', pose:POSE_DRAGON.RECOVER,   duration:0.35, ease:EASING.easeInOutSine} ] },
  rock:     { frames:[ {name:'WINDUP', pose:POSE_ROCK.WINDUP,     duration:0.20, ease:EASING.easeInQuad}, {name:'STRIKE', pose:POSE_ROCK.STRIKE,     duration:0.15, ease:EASING.easeOutBack}, {name:'RECOVER', pose:POSE_ROCK.RECOVER,     duration:0.35, ease:EASING.easeInOutSine} ] },
};

function playMove(p, move) {
  const m = MOVE_CLIPS[move] || MOVE_CLIPS.rock;
  p.animState = { move, clip:m, phaseIdx:0, phaseT:0, active:true, highlightT:0 };
}

function updateMoveAnim(p, dt) {
  const st = p.animState;
  if (!st || !st.active) return;
  const f = st.clip.frames[st.phaseIdx];
  st.phaseT += dt / Math.max(0.001, f.duration);
  if (st.highlightT > 0) st.highlightT -= dt;
  if (st.phaseT >= 1) {
    st.phaseT = 1;
    st.phaseIdx++;
    if (st.phaseIdx >= st.clip.frames.length) {
      st.active = false; st.phaseIdx = st.clip.frames.length - 1; st.phaseT = 1;
      applyPoseToRig(p.avatar, POSE_IDLE);
      return;
    } else {
      st.phaseT = 0;
      if (st.clip.frames[st.phaseIdx].name === 'STRIKE') st.highlightT = 0.12;
    }
  }
  const a = st.clip.frames[st.phaseIdx-1] ? st.clip.frames[st.phaseIdx-1].pose : POSE_IDLE;
  const b = st.clip.frames[st.phaseIdx].pose;
  const t = st.clip.frames[st.phaseIdx].ease(st.phaseT);
  const pose = blendPose(a, b, t);
  applyPoseToRig(p.avatar, pose);

  // 出招瞬间手臂高亮
  if (st.highlightT > 0 && p.avatar.glowMat) {
    const intensity = (st.highlightT / 0.12) * 2.5;
    p.avatar.glowMat.emissiveIntensity = 0.35 + intensity;
  } else if (p.avatar.glowMat) {
    p.avatar.glowMat.emissiveIntensity = THREE.MathUtils.lerp(p.avatar.glowMat.emissiveIntensity, 0.35, dt*8);
  }
}

function blendPose(a, b, t) {
  const pose = {};
  for (const k in JOINTS) {
    const j = JOINTS[k];
    const qa = a[j] || new THREE.Quaternion();
    const qb = b[j] || new THREE.Quaternion();
    pose[j] = new THREE.Quaternion().slerpQuaternions(qa, qb, t);
  }
  return pose;
}

function applyPoseToRig(rig, pose) {
  if (!rig || !rig.bones) return;
  for (const k in JOINTS) {
    const j = JOINTS[k];
    if (rig.bones[j] && rig.bones[j].group && pose[j]) {
      rig.bones[j].group.quaternion.copy(pose[j]);
    }
  }
}

function resetAvatarPose(p) {
  if (p && p.avatar) {
    applyPoseToRig(p.avatar, POSE_IDLE);
    p.animState = null;
  }
}

const THEME_TRANSITION = { from: null, to: null, t: 0, duration: 0.6 };

// 从 theme 提取灯光颜色（THREE.Color 缓存）
const themeCache = {};
function _tc(hex) {
  if (!themeCache[hex]) themeCache[hex] = new THREE.Color(hex);
  return themeCache[hex];
}

function applyPhaseTheme(phase, immediate=false) {
  const to = PHASE_THEMES[phase] || PHASE_THEMES[PHASE.SELECT];
  if (immediate || !THEME_TRANSITION.from) {
    THEME_TRANSITION.from = to;
    THEME_TRANSITION.to = to;
    THEME_TRANSITION.t = 1;
    applyThemeLights(to);
    applyThemeCss(to);
  } else {
    THEME_TRANSITION.from = THEME_TRANSITION.to;
    THEME_TRANSITION.to = to;
    THEME_TRANSITION.t = 0;
  }
}

function applyThemeLights(th) {
  scene.background.copy(_tc(th.bg));
  if (scene.fog) scene.fog.color.copy(_tc(th.fog));
  ambient.color.copy(_tc(th.ambient.color)); ambient.intensity = th.ambient.intensity;
  dirLight.color.copy(_tc(th.dir.color)); dirLight.intensity = th.dir.intensity;
  rimLight.color.copy(_tc(th.rim.color)); rimLight.intensity = th.rim.intensity;
}

function applyThemeCss(th) {
  document.documentElement.style.setProperty('--theme-accent', th.accent);
  document.documentElement.style.setProperty('--theme-edge-top', th.edge.top);
  document.documentElement.style.setProperty('--theme-edge-bottom', th.edge.bottom);
  document.documentElement.style.setProperty('--theme-vignette', th.vignette);
  const banner = document.getElementById('phase-indicator');
  if (banner) banner.style.borderColor = th.banner.border;
  if (banner) banner.dataset.pulse = th.banner.pulse ? 'on' : 'off';
}

function updateThemeTransition(dt) {
  const tr = THEME_TRANSITION;
  if (!tr.from || tr.t >= 1) return;
  tr.t = Math.min(1, tr.t + dt / Math.max(0.001, tr.duration));
  const f = tr.from, t = tr.to, k = tr.t;
  // 颜色插值
  scene.background.copy(_tc(f.bg)).lerp(_tc(t.bg), k);
  scene.fog.color.copy(_tc(f.fog)).lerp(_tc(t.fog), k);
  ambient.color.copy(_tc(f.ambient.color)).lerp(_tc(t.ambient.color), k);
  ambient.intensity = f.ambient.intensity + (t.ambient.intensity - f.ambient.intensity) * k;
  dirLight.color.copy(_tc(f.dir.color)).lerp(_tc(t.dir.color), k);
  dirLight.intensity = f.dir.intensity + (t.dir.intensity - f.dir.intensity) * k;
  rimLight.color.copy(_tc(f.rim.color)).lerp(_tc(t.rim.color), k);
  rimLight.intensity = f.rim.intensity + (t.rim.intensity - f.rim.intensity) * k;
  if (k >= 1) applyThemeCss(t);
}

// Boss 动画运行时状态
const bossAnim = { state:'IDLE', t:0, attackType:'melee', hitFlashT:0, deathT:-1 };

// 调用各状态动画：每帧由 updateBossMech(dt) 驱动
function updateBossMech(dt, now) {
  const idle = bossAnim.state === 'IDLE';
  const windup = bossAnim.state === 'MELEE_WINDUP' || bossAnim.state === 'RANGE_WINDUP';
  const strike = bossAnim.state === 'MELEE_STRIKE' || bossAnim.state === 'RANGE_FIRE';
  const hit = bossAnim.hitFlashT > 0;
  // 待机呼吸浮动
  const breathY = idle ? Math.sin(now*0.002)*0.2 : 0;
  torso.position.y = 9.4 + breathY;
  // 核心脉动
  const pulse = 1 + Math.sin(now*0.004)*0.15 + (windup?0.2:0) + (strike?0.35:0);
  core.scale.setScalar(pulse);
  coreMat.emissiveIntensity = 1.2 + Math.sin(now*0.004)*0.4 + (windup?1.0:0) + (strike?2.0:0);
  // 攻击时核心转红
  const charge = windup || strike;
  if (charge) { coreMat.color.set(0xff2d2d); coreMat.emissive.set(0xff0000); coreLight.color.set(0xff2d2d); }
  else { coreMat.color.set(0x22e0e0); coreMat.emissive.set(0x0aa0c0); coreLight.color.set(0x22e0e0); }
  // 独眼扫描/充能闪烁
  eye.position.x = idle ? Math.sin(now*0.0012)*0.15 : 0;
  eyeMat.emissiveIntensity = 1.2 + (charge?Math.sin(now*0.03)*1.5:0);
  // 受击闪白
  if (hit) { bossAnim.hitFlashT -= dt; const t=Math.max(0,bossAnim.hitFlashT); const f=Math.min(1,t/0.25); bossFlash(f); }
  // 死亡解体中
  if (bossAnim.deathT >= 0) {
    bossAnim.deathT += dt;
    updateBossDeath(bossAnim.deathT);
  }
  // 攻击手臂动作
  const armSwing = windup ? Math.sin(now*0.008)*0.3 : 0;
  armR.upper.rotation.z = -0.15 - armSwing*0.6 + (strike?-0.4:0);
  armR.fore.rotation.z = -0.1 - armSwing*0.4 + (strike?-0.3:0);
}

function bossFlash(f) {
  const mats = []; bossGroup.traverse(o => { if (o.isMesh && o.material) mats.push(o.material); });
  mats.forEach(m => { if (m.emissive) m.emissiveIntensity = (m.emissiveIntensity||0) + f*1.5; });
}

function updateBossDeath(t) {
  // 下跪 + 核心过载 + 部件逐渐解体淡出
  const sink = Math.min(1, t*0.8);
  bossGroup.position.z = 36 + sink*1.5;
  // 核心过载扩散：限制最大扩散幅度，避免无限放大
  const coreScale = Math.min(4, 1 + t*3.0);
  core.scale.setScalar(coreScale);
  coreMat.emissiveIntensity = Math.min(8, 3 + t*6);
  // 死亡特效 timer：播放约 5 秒后自动消失
  if (t > 5) { core.visible = false; coreLight.visible = false; }
  if (t > 1.0) {
    bossGroup.rotation.x = Math.min(1.2, (t-1.0)*1.5);
  }
  if (t > 1.8) {
    const fade = Math.max(0, 1 - (t-1.8)*0.6);
    bossGroup.traverse(o => { if (o.isMesh) { o.material.transparent = true; o.material.opacity = fade; } });
  }
}

function makeTextSprite(text, fontSize, color) {
  // 自适应画布：按文本实际宽度扩张，避免长文字（如"连击 -4"）被 256px 画布裁成"切一刀"
  const c = document.createElement('canvas');
  const tmp = c.getContext('2d');
  tmp.font = `900 ${fontSize}px Arial`;
  const tw = Math.ceil(tmp.measureText(text).width);
  const pad = Math.ceil(fontSize*0.6);          // 左右留白，防描边被裁
  const W = Math.max(256, tw + pad*2);
  const H = Math.max(256, fontSize*2);
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.font = `900 ${fontSize}px Arial`;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.lineWidth = 18; g.strokeStyle = '#000000aa'; g.strokeText(text, W/2, H/2);
  g.fillStyle = color; g.fillText(text, W/2, H/2);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, transparent:true, depthTest:false }));
  // 记录原始宽高比，供调用方保持比例（默认按 256 基准 scale=1.6 缩放）
  s.userData.aspect = W/H;
  c.__text = text;  // 调试：记录文本便于校验画布尺寸
  return s;
}

const floatPool = [];
function spawnFloat(pos3, text, color) {

  const a = (s.userData.aspect || 1);

}
function updateFloats(dt) {
  for (let i = floatPool.length-1; i >= 0; i--) {
    const f = floatPool[i];
    f.life -= dt; f.sprite.position.y += f.vy*dt;
    f.sprite.material.opacity = Math.max(0, f.life);
    if (f.life <= 0) { scene.remove(f.sprite); floatPool.splice(i,1); }
  }
}

// 创建胶囊几何体，兼容 THREE.js 版本（<0.165 无 CapsuleGeometry 时使用 Lathe）
function makeCapsule(r, len, capSegs=4, radialSegs=12) {
  if (typeof THREE.CapsuleGeometry !== 'undefined') {
    return new THREE.CapsuleGeometry(r, len, capSegs, radialSegs);

// ═══════════════════════════════════════════════════════════
//  骨骼关键点 / 滤波
// ═══════════════════════════════════════════════════════════
const KP = { NOSE:0, L_SHOULDER:11, R_SHOULDER:12, L_ELBOW:13, R_ELBOW:14, L_WRIST:15, R_WRIST:16 };
const ACTIVE_KP = Object.values(KP);
const OE = { fcmin:1.0, beta:0.007, fcd:1.0, states:{}, initialized:false };
function oeFilter(key, val, t) {
  const s = OE.states[key];
  if (!s) { OE.states[key] = { hatX:val, dx:0, lastT:t }; return val; }
  const dt = (t - s.lastT)/1000;
  if (dt <= 0) return s.hatX;
  const dx = (val - s.hatX)/dt;
  const alphaD = dt/(dt + 1/(2*Math.PI*OE.fcd));
  s.dx += alphaD*(dx - s.dx);
  const fc = OE.fcmin + OE.beta*Math.abs(s.dx);
  const alpha = dt/(dt + 1/(2*Math.PI*fc));
  s.hatX += alpha*(val - s.hatX);
  s.lastT = t;
  return s.hatX;
}
function applyFilter(raw, mirrorX=false) {
  const t = performance.now();
  const out = raw.map(p => ({ x: mirrorX ? (1-p.x) : p.x, y:p.y, visibility:p.visibility }));
  for (const idx of ACTIVE_KP) for (const axis of ['x','y']) {
    const key = `${idx}_${axis}`;
    if (!OE.states[key]) OE.states[key] = { hatX:out[idx][axis], dx:0, lastT:t };
    else out[idx][axis] = oeFilter(key, out[idx][axis], t);
  }
  return out;
}
function scaleBone(start, end, targetLen) {
  const dx = end.x-start.x, dy = end.y-start.y;
  const cur = Math.hypot(dx, dy);
  if (cur < 0.001) return;
  const s = targetLen/cur;
  end.x = start.x + dx*s; end.y = start.y + dy*s;
}
function applySymmetry(lm) {
  const d = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
  const uL = d(lm[KP.L_SHOULDER],lm[KP.L_ELBOW]), uR = d(lm[KP.R_SHOULDER],lm[KP.R_ELBOW]);
  const fL = d(lm[KP.L_ELBOW],lm[KP.L_WRIST]), fR = d(lm[KP.R_ELBOW],lm[KP.R_WRIST]);
  if (uL>0.001 && uR>0.001) { const av=(uL+uR)/2; scaleBone(lm[KP.L_SHOULDER],lm[KP.L_ELBOW],av); scaleBone(lm[KP.R_SHOULDER],lm[KP.R_ELBOW],av); }
  if (fL>0.001 && fR>0.001) { const av=(fL+fR)/2; scaleBone(lm[KP.L_ELBOW],lm[KP.L_WRIST],av); scaleBone(lm[KP.R_ELBOW],lm[KP.R_WRIST],av); }
}
function pipeline(raw, mirrorX=false) {
  const f = applyFilter(raw, mirrorX).map(p => ({ x:p.x, y:p.y, visibility: typeof p.visibility==='number' ? p.visibility : 0 }));
  applySymmetry(f); return f;
}

// ═══════════════════════════════════════════════════════════
//  手势分类
// ═══════════════════════════════════════════════════════════
function classifyGesture(lm) {
  if (!lm) return null;
  const P = i => ({ x:lm[i].x, y:lm[i].y, v:lm[i].visibility });
  const lS=P(KP.L_SHOULDER), rS=P(KP.R_SHOULDER);
  const lE=P(KP.L_ELBOW), rE=P(KP.R_ELBOW);
  const lW=P(KP.L_WRIST), rW=P(KP.R_WRIST);
  const minVis=0.25;
  if (lS.v<minVis || rS.v<minVis) return null;
  const sw = Math.abs(rS.x-lS.x);
  if (sw < 0.05) return null;
  const nose = lm[KP.NOSE];
  const noseY = (nose && nose.visibility>0.4) ? nose.y : (lS.y+rS.y)/2 - sw*0.55;
  const neckY = (lS.y+rS.y)/2;
  const hipY = neckY + sw*2.2;

  // 升龙
  if ((lW.v>minVis && lW.y < noseY-0.03) || (rW.v>minVis && rW.y < noseY-0.03)) return MOVE.DRAGON;
  // 石头/防御：双手在胸前靠拢（不必严格交叉，只要双腕靠近且位于胸口区域）
  if (lW.v>minVis && rW.v>minVis) {
    const wDist = Math.hypot(lW.x-rW.x, lW.y-rW.y);
    const wMidY = (lW.y+rW.y)/2;
    if (wDist < sw*0.95 && wMidY > neckY-0.02 && wMidY < hipY-0.02) return MOVE.STONE;
  }
  // 剪刀：手臂水平前伸
  const stab = (w,e,s,side) => (w.v>minVis && e.v>minVis) && (side==='left'? w.x<e.x-0.03 : w.x>e.x+0.03) && Math.abs(w.y-s.y)<0.16;
  if (stab(lW,lE,lS,'left') || stab(rW,rE,rS,'right')) return MOVE.SCISSORS;
  // 不出招：双腕下垂
  if ((lW.v>minVis && lW.y>hipY) || (rW.v>minVis && rW.y>hipY)) return MOVE.PASS;
  return null;
}
function detectLean(lm) {
  if (!lm) return 0;
  const lS=lm[KP.L_SHOULDER], rS=lm[KP.R_SHOULDER], nose=lm[KP.NOSE];
  if (lS.visibility<0.25 || rS.visibility<0.25) return 0;
  const midX=(lS.x+rS.x)/2;
  const sw=Math.abs(rS.x-lS.x)||0.1;
  const nX=(nose && nose.visibility>0.2)?nose.x:midX;
  const off=(nX-midX)/sw;
  if (off>0.32) return 1;
  if (off<-0.32) return -1;
  return 0;
}

// ═══════════════════════════════════════════════════════════
let poseSolution = null;
let cameraActive = false;
let lastVideoTime = -1;
let lastPoses = [];

async function initPoseDetector() {
  poseSolution = new window.Pose({
    locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/${file}`
  });
  poseSolution.setOptions({
    modelComplexity: 1,
    smoothLandmarks: true,
    enableSegmentation: false,
    minDetectionConfidence: 0.4,
    minTrackingConfidence: 0.4,
    selfieMode: true,
  });
  poseSolution.onResults(onPoseResults);
  poseModelInfo = 'legacy pose / selfie';
  console.log('[Pose] legacy Pose 初始化完成，selfieMode=true');
}

function onPoseResults(results) {
  const landmarks = results.poseLandmarks;
  lastPoses = landmarks ? [landmarks] : [];
  distributePoses(lastPoses);
  drawPoseOnCamera(landmarks);
}

function distributePoses(poses) {
  const n = Math.min(poses.length, MAX_PLAYERS);
  for (let i=0;i<MAX_PLAYERS;i++) {
    if (!players[i]) players[i] = createPlayerState(i);
    players[i].active = i<n;
    players[i].avatar.group.visible = i<n;   // 未激活玩家隐藏白盒
    players[i].lm = i<n ? pipeline(poses[i], false) : null;
  }
  if (n !== activeCount) { activeCount = n; layoutPlayers(); players.forEach((p,i)=>{ if(i<n) p.inited=true; }); }
}

// 根据肩中点在画面中的水平位置，把玩家映射到最近的轨道，保证 avatar 永远站在轨道中心
// 注意：MediaPipe selfieMode=true 时 landmark 已是镜像坐标系（与镜像预览一致），
// 用户向右移动 → shoulderX 增大 → 白盒也应向右，故用 (shoulderX - 0.5) 而非 (0.5 - shoulderX)。
function updatePlayerLaneFromPose(p) {
  if (!p || !p.lm || !p.active) return;
  const lS = p.lm[KP.L_SHOULDER], rS = p.lm[KP.R_SHOULDER];
  if (!lS || !rS || (lS.visibility<0.2 && rS.visibility<0.2)) return;
  const shoulderX = (lS.x + rS.x) / 2;
  const worldX = WORLD_SHIFT_X + (shoulderX - 0.5) * LANE_STEP * 2.2;
  const lane = Math.round((worldX - WORLD_SHIFT_X) / LANE_STEP);
  p.targetLane = Math.max(-1, Math.min(1, lane));
  p.laneSmooth = (p.laneSmooth || 0) + (p.targetLane - (p.laneSmooth || 0)) * 0.18;
  p.lane = Math.round(p.laneSmooth);
}

// 在摄像头预览画面上叠加骨骼连线
const cameraOverlayCanvas = document.createElement('canvas');
cameraOverlayCanvas.width = 640; cameraOverlayCanvas.height = 480;
cameraOverlayCanvas.style.position = 'fixed';
cameraOverlayCanvas.style.left = '14px';
cameraOverlayCanvas.style.top = '60px';
cameraOverlayCanvas.style.width = '240px';
cameraOverlayCanvas.style.height = '180px';
cameraOverlayCanvas.style.borderRadius = '10px';
cameraOverlayCanvas.style.pointerEvents = 'none';
cameraOverlayCanvas.style.zIndex = '9';
// 注意：MediaPipe selfieMode=true 时 landmark 已是镜像坐标，与 #camera-video 的 scaleX(-1) 显示一致，
// 这里不再翻转，否则骨骼会与人物左右反向
document.body.appendChild(cameraOverlayCanvas);
const cameraOverlayCtx = cameraOverlayCanvas.getContext('2d');

function drawPoseOnCamera(landmarks) {
  const ctx = cameraOverlayCtx;
  const w = cameraOverlayCanvas.width, h = cameraOverlayCanvas.height;
  ctx.clearRect(0,0,w,h);
  if (!landmarks || !landmarks.length) return;
  window.drawConnectors(ctx, landmarks, POSE_CONNECTIONS, { color:'#00ff88', lineWidth:3 });
  window.drawLandmarks(ctx, landmarks, { color:'#ff3366', lineWidth:2, radius:5 });
  const upperIdx = [0,11,12,13,14,15,16];
  const pts = upperIdx.filter(i=>landmarks[i]).map(i=>landmarks[i]);
  window.drawLandmarks(ctx, pts, { color:'#ffd166', lineWidth:2, radius:6 });
}

async function startPoseCamera() {
  if (!poseSolution) await initPoseDetector();
  const camera = new window.Camera(cameraVideo, {
    onFrame: async () => { await poseSolution.send({ image: cameraVideo }); },
    width: 640, height: 480
  });
  await camera.start();
  cameraActive = true;
  cameraVideo.classList.add('on');
  poseModelInfo = 'legacy pose / selfie';
}

// 演示模式
let DEMO = new URLSearchParams(location.search).has('demo');
if (DEMO) poseModelInfo = 'demo / 模拟';
function demoMoveFor(i, t) {
  // 每个玩家周期性切换攻击/防御手势
  const cycle = 4; // 4 秒一个手势循环，足够保持选中
  const ph = ((t + i*1.3) % cycle) / cycle;
  if (ph < 0.4) return MOVE.SCISSORS;
  if (ph < 0.7) return MOVE.DRAGON;
  return MOVE.STONE;
}
function demoPoses() {
  if (!DEMO) return;
  const t = performance.now()/1000;
  const n = Math.max(1, activeCount||1);
  const bases = LANE_LAYOUT[Math.min(4,Math.max(1,n))];
  const fake = [];
  for (let i=0;i<n;i++) {
    const sw=0.14;
    // 玩家 i 的基础屏幕 X 偏移对应世界 X；LANE_STEP 变大后减小映射系数，避免越界
    const baseOff = bases[i] / 16;
    // Boss 阶段每个玩家通过"身体侧倾"换轨道躲闪。
    // 关键：侧倾时肩中点保持稳定（updatePlayerLaneFromPose 的 targetLane 保持 0），
    // 只有鼻子相对肩部偏移触发 detectLean → lane ±1。
    // 若把 laneOff 同时加进 midX，会导致位置检测与 lean 修正相互抵消（targetLane+lean=0），玩家不动。
    // 演示模式：让玩家换轨后保持一段时间（≥800ms），避免截图永远抓到滑动中的中间帧
    let laneOff = 0;
    if (phase === PHASE.BOSS_ATTACK) {
      const lanePhase = ((t + i*1.1) % 5.5) / 5.5;
      if (lanePhase < 0.15)      laneOff = 0;                                  // 起手 0.8s 中性
      else if (lanePhase < 0.55) laneOff = (i % 2 === 0) ? 1 : -1;             // 2.2s 内向一侧躲
      else                       laneOff = (i % 2 === 0) ? -1 : 1;             // 2.5s 内反向躲
    }
    const midX = 0.5 + baseOff;   // 肩中点稳定，不随躲闪变化
    const m = demoMoveFor(i, t);
    // Boss 阶段玩家尽量摆防御（石头），让反击/减伤发生
    const gesture = (phase === PHASE.BOSS_ATTACK && i===0) ? MOVE.STONE : m;
    const wY = gesture===MOVE.DRAGON?0.28 : gesture===MOVE.SCISSORS?0.42 : gesture===MOVE.STONE?0.5 : 0.62;
    // 倾斜：鼻子相对肩中点偏移，模拟头部左右摆动（系数 0.6*0.6=0.36>0.32 触发 detectLean=±1）
    const noseOff = phase===PHASE.BOSS_ATTACK ? laneOff*0.6 : 0;
    const pt=(x,y,v=1)=>({x:midX+x*sw,y:y,z:0,visibility:v});
    fake.push([
      pt(noseOff,0.30),pt(0,0,0),pt(0,0,0),pt(0,0,0),pt(0,0,0),pt(0,0,0),pt(0,0,0),pt(0,0,0),pt(0,0,0),pt(0,0,0),pt(0,0,0),
      pt(-0.5,0.46),pt(0.5,0.46),pt(-0.5,0.56),pt(0.5,0.56),
      gesture===MOVE.STONE?pt(0.05,0.50):pt(-0.55,wY+0.05),
      gesture===MOVE.STONE?pt(-0.05,0.50):pt(0.55,wY+0.05),
    ]);
  }
  lastPoses = fake;
  distributePoses(fake);
}

// 骨骼捕捉调试窗（仅 DEMO 测试版本显示）：火柴人 + 归一化坐标 + lean/distance
function drawPoseDebug() {
  const showDebug = DEMO || cameraActive;
  poseDebugBox.style.display = showDebug ? 'block' : 'none';
  if (demoHint) {
    if (DEMO || cameraActive) demoHint.style.display = 'none';
    else { demoHint.style.display = 'block'; demoHint.textContent = '提示：点击右下角「开启摄像头」开始游玩'; }
  }
  if (!showDebug) return;
  const p = players[0];
  const ctx = poseDebugCtx;
  const cw = poseDebugCanvas.width, ch = poseDebugCanvas.height;
  // 用不透明深色填充，避免空画布显示成透明棋盘格
  ctx.fillStyle = 'rgba(12,16,26,0.85)';
  ctx.fillRect(0, 0, cw, ch);

  const g = p && p.lm ? p.gesture : null;
  poseDebugMove.textContent =
    g === MOVE.SCISSORS ? '✂️ 剪刀·刺' :
    g === MOVE.DRAGON ? '🐉 升龙拳' :
    g === MOVE.STONE ? '🪨 石头·守' :
    g === MOVE.PASS ? '🚫 不出招' : '— 未识别';

  const lm = p ? p.lm : null;
  if (!lm || lm[KP.L_SHOULDER].visibility < 0.2) {
    const hint = cameraActive
      ? `正在检测…\n模型:${poseModelInfo}\n已检出:${lastPoses.length}人\n请正对摄像头，退后一步让全身入镜`
      : '未检测到骨骼';
    poseDebugCoords.textContent = hint;
    ctx.fillStyle = '#667080';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(hint.split('\n')[0], cw / 2, ch / 2);
    return;
  }

  const pt = i => ({ x: lm[i].x, y: lm[i].y });
  const nose = pt(KP.NOSE);
  const lS = pt(KP.L_SHOULDER), rS = pt(KP.R_SHOULDER);
  const lE = pt(KP.L_ELBOW), rE = pt(KP.R_ELBOW);
  const lW = pt(KP.L_WRIST), rW = pt(KP.R_WRIST);
  const neck = { x: (lS.x + rS.x) / 2, y: (lS.y + rS.y) / 2 };

  // 归一化坐标 → 画布坐标
  const padX = 26, padY = 22;
  const sx = v => padX + v.x * (cw - padX * 2);
  const sy = v => padY + v.y * (ch - padY * 2);

  const line = (a, b, color, w) => {
    ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(sx(a), sy(a)); ctx.lineTo(sx(b), sy(b)); ctx.stroke();
  };
  const joint = (a, r, color) => {
    ctx.fillStyle = color; ctx.beginPath(); ctx.arc(sx(a), sy(a), r, 0, Math.PI * 2); ctx.fill();
  };

  // 骨骼连线：颈-鼻、颈-肩、肩-肘、肘-腕
  const bone = '#5ad1ff';
  line(nose, neck, bone, 2.5);
  line(neck, lS, bone, 2); line(neck, rS, bone, 2);
  line(lS, lE, bone, 2); line(rS, rE, bone, 2);
  line(lE, lW, bone, 2); line(rE, rW, bone, 2);
  line(lS, rS, 'rgba(255,255,255,0.35)', 1.5);

  // 关节点
  joint(nose, 6, '#ffffff');
  joint(neck, 4, '#ffd166');
  joint(lS, 4.5, '#4ec9ff'); joint(rS, 4.5, '#4ec9ff');
  joint(lE, 4, '#69f0ae'); joint(rE, 4, '#69f0ae');
  joint(lW, 4.5, '#ff6b6b'); joint(rW, 4.5, '#ff6b6b');

  // 数值：lean / lane / 肩宽 / 双腕距
  const sw = Math.abs(rS.x - lS.x);
  const midX = (lS.x + rS.x) / 2;
  const off = sw > 0.05 ? (nose.x - midX) / sw : 0;
  const wristDist = Math.hypot(lW.x - rW.x, lW.y - rW.y);
  const lane = p ? p.lane : 0;
  const targetLane = p ? p.targetLane : 0;
  const f2 = v => (v ?? 0).toFixed(2);
  poseDebugCoords.textContent =
`鼻 (${f2(nose.x)},${f2(nose.y)})  颈 (${f2(neck.x)},${f2(neck.y)})
左肩(${f2(lS.x)},${f2(lS.y)}) 右肩(${f2(rS.x)},${f2(rS.y)})
左肘(${f2(lE.x)},${f2(lE.y)}) 右肘(${f2(rE.x)},${f2(rE.y)})
左腕(${f2(lW.x)},${f2(lW.y)}) 右腕(${f2(rW.x)},${f2(rW.y)})
lean ${f2(off)} | lane ${lane}(目标${targetLane}) | 肩宽 ${f2(sw)}
双腕距 ${f2(wristDist)} | 检出:${lastPoses.length}人
模型 ${poseModelInfo}`;
}

// ═══════════════════════════════════════════════════════════
//  回合状态机
// ═══════════════════════════════════════════════════════════
let phase = PHASE.WAITING;
let phaseStart = 0;
let round = 0;
let bossHp = MAX_HP_BOSS;
let bossAttackType = BOSS_ATTACK.MELEE;
let bossAttackLane = 0;
let bossAttackResolved = false;
let prevWarn = false;

const HUD = [0,1,2,3].map(i => {
  const el = document.getElementById(`hud-${i}`);
  return { el, fill:el.querySelector('.p-hp-fill'), hpText:el.querySelector('.p-hp-text'), status:el.querySelector('.p-status'), moveCards:[...el.querySelectorAll('.move-card')] };
});

function setPhase(p) {
  phase = p; phaseStart = performance.now(); bossAttackResolved = false;
  const map = {
    [PHASE.WAITING]:['phase-waiting','⏳ 等待开始'],
    [PHASE.SELECT]:['phase-select','🎯 选招阶段'],
    [PHASE.EXECUTE]:['phase-execute','⚔️ 出招阶段'],
    [PHASE.BOSS_ATTACK]:['phase-boss','👹 Boss 攻击！'],
    [PHASE.RESOLVE]:['phase-resolve','💥 结算'],
    [PHASE.ROUND_END]:['phase-roundend','✅ 回合结束'],
    [PHASE.GAMEOVER]:['phase-gameover','🏁 游戏结束'],
    [PHASE.VICTORY]:['phase-victory','🏆 胜利！'],
  };
  phaseEl.className = map[p][0]; phaseEl.textContent = map[p][1];
  // 阶段氛围切换（BOSS_ATTACK 需先创建机甲后应用主题，此处统一触发）
  if (PHASE_THEMES[p]) applyPhaseTheme(p);
  if (p === PHASE.BOSS_ATTACK) startBossAttack();
  if (p === PHASE.VICTORY) {
    bossAnim.deathT = 0; bossAnim.state = 'DEATH';   // 机甲解体动画
    setMessage('🏆 胜利！Boss 已被击败\n点击「开始游戏」再战', false);
  }
  if (p === PHASE.GAMEOVER) setMessage('🏁 全员倒下\n点击「开始游戏」重开', false);
}

function startGame() {
  round = 0; bossHp = MAX_HP_BOSS;
  // 重置机甲状态：恢复姿态、透明度和位置
  bossAnim.state = 'IDLE'; bossAnim.deathT = -1; bossAnim.hitFlashT = 0;
  bossGroup.position.set(0, 0, 36);
  bossGroup.rotation.x = 0;
  bossGroup.traverse(o => { if (o.isMesh) { o.material.transparent = false; o.material.opacity = 1; } });
  core.visible = true; coreLight.visible = true;   // 恢复死亡特效消失后的核心
  players.forEach(p => { p.hp=MAX_HP_PLAYER; p.alive=true; p.combo=[]; p.defending=false; p.attackAnim=null; resetAvatarPose(p); });
  updateBossHp();
  startRound();
}
function startRound() {
  round++; roundEl.textContent = `回合 ${round}`;
  players.forEach(p => { p.combo=[]; p.gesture=null; p.gestureHoldStart=0; p.defending=false; p.defendFrames=0; p.attackAnim=null; });
  lastExecutedSeg = -1;
  warnGroup.visible = false;
  setPhase(PHASE.SELECT);
  setMessage(`第 ${round} 回合 | 摆出招式构筑组合（每人 ${COMBO_LEN} 招）`, true);
}
function setMessage(t, small=false) { messageBox.textContent = t; messageBox.className = small?'small':''; }

function tryConfirmGesture(p, now) {
  if (DEMO) {
    // 演示模式：每 700ms 自动确认一个招式，只选攻击/不出招（选招阶段不选防御）
    if (p.combo.length < COMBO_LEN && now - p.lastConfirm > 700) {
      const r = Math.sin(now/400 + p.index*3) > 0 ? MOVE.SCISSORS : MOVE.DRAGON;
      p.combo.push(r);
      p.lastConfirm = now;
      spawnFloat(new THREE.Vector3(WORLD_SHIFT_X + p.laneSmooth*LANE_STEP, 3.2, 12), `${MOVE_ICONS[r]} 已选`, '#ffffff');
    }
    return;
  }
  if (now - p.lastConfirm < RECONFIRM_MS) return;
  if (p.gesture === null) { p.gestureHoldStart = 0; return; }
  if (p.gestureHoldStart === 0) { p.gestureHoldStart = now; return; }
  if (now - p.gestureHoldStart >= GESTURE_HOLD_MS) {
    p.combo.push(p.gesture);
    p.lastConfirm = now; p.gestureHoldStart = 0;
    spawnFloat(new THREE.Vector3(WORLD_SHIFT_X + p.laneSmooth*LANE_STEP, 3.2, 12), `${MOVE_ICONS[p.gesture]} 已选`, '#ffffff');
  }
}
function allLocked() {
  const act = players.filter(p => p.active && p.alive);
  return act.length>0 && act.every(p => p.combo.length>=COMBO_LEN);
}
function finishSelect() {
  players.forEach(p => { if (p.active && p.alive) while (p.combo.length<COMBO_LEN) p.combo.push(MOVE.PASS); });
  setPhase(PHASE.EXECUTE);
}

function updateExecute(dt, now) {
  const el = now - phaseStart;
  const segDur = EXECUTE_MS/COMBO_LEN;
  const seg = Math.min(COMBO_LEN-1, Math.floor(el/segDur));
  const segT = (el%segDur)/segDur;
  // 出招动画：每个新 segment 触发一次招式动画
  players.forEach(p => {
    if (!p.active || !p.alive) return;
    const mv = p.combo[seg];
    p.defending = false;
    if (!p.attackAnim || p.attackAnim.seg !== seg) {
      p.attackAnim = { seg, move:mv, t:0 };
      if (mv && mv !== MOVE.PASS) playMove(p, mv);
    } else {
      p.attackAnim.t += dt;
    }
  });
  // 逐段结算伤害（每段开始时结算一次）
  const segStart = Math.floor((now-phaseStart)/segDur);
  // 用 marker 防止重复结算
  if (segStart !== lastExecutedSeg) {
    lastExecutedSeg = segStart;
    if (segStart < COMBO_LEN) {
      players.forEach(p => {
        if (!p.active || !p.alive) return;
        const mv = p.combo[segStart];
        if (MOVES[mv].type === 'attack') {
          let dmg = MOVES[mv].damage;
          // 连击增伤：同回合上一段也是攻击，则本段 +1 伤害
          if (segStart > 0 && MOVES[p.combo[segStart-1]].type === 'attack') dmg += 1;
          bossHp = Math.max(0, bossHp - dmg);
          bossAnim.hitFlashT = 0.3;   // 机甲受击闪白
          const label = dmg === MOVES[mv].damage ? `-${dmg}` : `连击 -${dmg}`;
          spawnFloat(new THREE.Vector3(0, 24, 32), label, '#ff6b6b');
          updateBossHp();
        }
      });
      if (bossHp <= 0) { setPhase(PHASE.VICTORY); return; }
    }
  }
  if (el >= EXECUTE_MS) setPhase(PHASE.BOSS_ATTACK);
}
let lastExecutedSeg = -1;

function startBossAttack() {
  bossAttackType = Math.random() < 0.5 ? BOSS_ATTACK.MELEE : BOSS_ATTACK.RANGED;
  bossAttackLane = Math.floor(Math.random()*3)-1;
  prevWarn = false;
  // 机甲前摇状态：近战后拉右臂 / 远程肩炮充能
  bossAnim.state = bossAttackType === BOSS_ATTACK.MELEE ? 'MELEE_WINDUP' : 'RANGE_WINDUP';
  bossAnim.attackType = bossAttackType === BOSS_ATTACK.MELEE ? 'melee' : 'range';
  // 控制各子组件显隐：近战只显示矩形+感叹号；远程只显示红圈+脉冲+弹道
  warnRect.visible = exMark.visible = bossAttackType === BOSS_ATTACK.MELEE;
  rangeRing.visible = pulseRing.visible = beamLine.visible = bossAttackType === BOSS_ATTACK.RANGED;
  warnGroup.visible = false;
  setMessage(bossAttackType===BOSS_ATTACK.MELEE ? '👹 近身挥击！摆「石头」防御 或 倾斜躲闪' : '👹 远程吐弹！倾斜躲闪（或石头减伤）', true);
}

function updateBossAttack(dt, now) {
  const el = now - phaseStart;
  const t = el / BOSS_WARN_MS;
  // 每玩家锁定其姿态（防御/倾斜）
  players.forEach(p => {
    if (!p.active || !p.alive) return;
    const lm = p.lm;
    if (lm) {
      const g = classifyGesture(lm);
      // 防御需在 Boss 阶段保持石头
      const isGuard = g === MOVE.STONE;
      if (isGuard) { p.defending = true; p.defendFrames++; }
      else { p.defending = false; p.defendFrames = 0; }
      // Boss 阶段同时根据头部/肩部偏移做最终 lean 修正，与位置检测叠加但允许小幅摆头躲闪
      const headLean = detectLean(lm);
      p.lean = headLean;
    }
    p.leanSmooth += (p.lean - p.leanSmooth)*Math.min(1, dt*6);
    // lane 取位置检测的目标 lane + 头部躲闪修正
    const headLaneOffset = Math.round(p.leanSmooth);
    p.lane = Math.max(-1, Math.min(1, (p.targetLane || 0) + headLaneOffset));
  });

  // 预警可视化
  warnGroup.visible = true;
  // 攻击落点 = bossAttackLane 轨道的 x 坐标（基于 LANE_X）
  const targetLaneX = LANE_X[bossAttackLane + 1]; // lane -1/0/1 → 0/1/2
  if (bossAttackType === BOSS_ATTACK.MELEE) {
    const flash = Math.floor(el/350)%2===0;
    warnRect.material.color.setHex(flash?0xff3030:0xffee00);
    exMark.material.opacity = flash?1:0.3;
    // 近战预警：放在 Boss 与玩家之间的空中（z≈20）
    warnGroup.position.set(targetLaneX, 10, 20);
    warnRect.rotation.set(0, Math.PI, 0);
    exMark.position.set(0, 0, 0.1);
    warnRect.scale.set(1.4, 1.4, 1);
  } else {
    // 远程：红圈 + 黄色脉冲 + 弹道线，落点在命中轨道上玩家脚下（z=4）
    const p = Math.min(1, el/BOSS_WARN_MS);
    const pr = 2.2 + p*0.6;
    rangeRing.scale.set(pr, pr, 1);
    pulseRing.scale.set(pr*(1+0.4*Math.sin(el/120)), pr*(1+0.4*Math.sin(el/120)), 1);
    pulseRing.material.opacity = 0.5+0.45*Math.sin(el/120);
    warnGroup.position.set(targetLaneX, 0.3, PLAYER_Z);
    // 弹道线：从 Boss 头到玩家脚下
    const p0 = new THREE.Vector3(0, 22, 30);  // Boss 头位置
    const p1 = new THREE.Vector3(targetLaneX, 1.0, PLAYER_Z);
    beamGeo.setFromPoints([p0, p1]);
  }

  if (el >= BOSS_WARN_MS) {
    resolveBossAttack();
  }
}

function resolveBossAttack() {
  warnGroup.visible = false;
  // 机甲出招动作
  bossAnim.state = bossAttackType === BOSS_ATTACK.MELEE ? 'MELEE_STRIKE' : 'RANGE_FIRE';
  setTimeout(() => { if (bossAnim.state !== 'DEATH') bossAnim.state = 'IDLE'; }, 600);
  const targetLaneX = LANE_X[bossAttackLane + 1];
  // 判定半径与预警可视化完全一致：近战=矩形半宽，远程=红圈外半径
  const radius = bossAttackType === BOSS_ATTACK.MELEE ? MELEE_RADIUS : RANGED_RADIUS;
  // 对每个存活玩家判定
  players.forEach(p => {
    if (!p.active || !p.alive) return;
    const playerX = WORLD_SHIFT_X + p.lane * LANE_STEP;
    // 几何判定：玩家是否位于预警圈/框内（圈外完全不受伤害）
    const inZone = Math.abs(playerX - targetLaneX) <= radius;
    const defended = p.defendFrames >= DEFEND_MIN_FRAMES;
    let dmg = 0; let guarded = false; let countered = false;
    if (inZone) {
      if (bossAttackType === BOSS_ATTACK.MELEE) {
        // 近战：防御 → 反弹伤害给 Boss，玩家不受伤
        if (defended) { countered = true; }
        else { dmg = BOSS_MELEE_DMG; }
      } else {
        // 远程：命中即掉血，不可反击；防御只能减伤
        if (defended) { dmg = BOSS_RANGED_GUARDED; guarded = true; }
        else { dmg = BOSS_RANGED_DMG; }
      }
    }
    const v = new THREE.Vector3(playerX, 2.2, PLAYER_Z);
    if (dmg > 0) {
      p.hp = Math.max(0, p.hp - dmg);
      spawnFloat(v, `-${dmg}`, guarded?'#69f0ae':'#ff6b6b');
    } else if (countered) {
      bossHp = Math.max(0, bossHp - COUNTER_DMG);
      bossAnim.hitFlashT = 0.3;   // 机甲受击闪白
      spawnFloat(v, `反击! -${COUNTER_DMG}`, '#ffc107');
      spawnFloat(new THREE.Vector3(0, 24, 32), `-${COUNTER_DMG}`, '#ffc107');
      updateBossHp();
    } else if (inZone && defended) {
      // 远程防御减伤已通过 dmg 分支处理；此处仅兜底显示
      spawnFloat(v, '挡住', '#4ec9ff');
    } else if (!inZone) {
      // 通过倾斜换轨成功躲出预警范围：给玩家明确正向反馈
      spawnFloat(v, '躲过!', '#7fffb3');
    }
    updatePlayerHp(p);
  });
  bossAttackResolved = true;
  // 检查胜利 / 全灭
  if (bossHp <= 0) { setPhase(PHASE.VICTORY); return; }
  const alive = players.filter(p=>p.active&&p.alive);
  if (alive.length===0) { setPhase(PHASE.GAMEOVER); return; }
  setPhase(PHASE.RESOLVE);
}

function updateResolve(dt, now) {
  if (now - phaseStart > ROUND_END_MS) startRound();
}

// ═══════════════════════════════════════════════════════════
//  Avatar 渲染（骨骼 → 3D）
// ═══════════════════════════════════════════════════════════
function updateAvatar(p, dt) {
  const av = p.avatar;
  const g = av.group;
  // 玩家 X 坐标：轨道组中心 + 轨道偏移。
  // lane ∈ {-1,0,1}，乘 LANE_STEP（= 轨道间距）后正好落在相邻轨道中心。
  // 用 xSmooth 平滑插值，换轨时滑动而非瞬移，保证躲闪动作肉眼可辨
  const targetX = WORLD_SHIFT_X + p.lane * LANE_STEP;
  const speed = Math.min(1, dt*8);   // 约 0.12s 滑到目标轨（敏捷但仍可见滑动过程）
  p.xSmooth = p.xSmooth + (targetX - p.xSmooth)*speed;
  const x = p.xSmooth;
  const y = 0;
  const z = PLAYER_Z;
  g.position.set(x, y, z);
  // 玩家正面对 Boss（沿 +Z 方向看），不旋转 Y
  g.rotation.y = 0;
  // 身体倾斜：左右摆动（X 轴旋转）
  g.rotation.z = p.lane * -0.18;

  // 核心判定点可见性（仅 Boss 攻击阶段）
  av.core.visible = phase === PHASE.BOSS_ATTACK;

  // 待机呼吸：胸腔轻微缩放与上下位移
  const breath = 1 + Math.sin(performance.now() * 0.002 + p.index) * 0.015;
  if (av.bones[JOINTS.CHEST]) av.bones[JOINTS.CHEST].group.scale.set(breath, breath, breath);

  // 驱动招式动画
  updateMoveAnim(p, dt);
}

// ═══════════════════════════════════════════════════════════
//  HUD 更新
// ═══════════════════════════════════════════════════════════
function updateBossHp() {
  bossHpFill.style.width = (bossHp/MAX_HP_BOSS*100)+'%';
  bossHpText.textContent = `${bossHp}/${MAX_HP_BOSS}`;
}
function updatePlayerHp(p) {
  const h = HUD[p.index];
  h.fill.style.width = (p.hp/MAX_HP_PLAYER*100)+'%';
  h.hpText.textContent = p.hp;
}
function updateHud() {
  players.forEach(p => {
    const h = HUD[p.index];
    h.el.classList.toggle('inactive', !p.active);
    h.el.classList.toggle('dead', !p.alive);
    // 状态文本
    let st = '未就位';
    let stCls = '';
    if (p.active && p.alive) {
      if (phase === PHASE.BOSS_ATTACK) {
        if (p.defending) { st='🪨 防御'; stCls='guard'; }
        else if (p.lane !== 0) { st = p.lane>0?'➡️ 右轨':'⬅️ 左轨'; stCls='dodge'; }
        else { st='⚪ 中立'; }
      } else if (phase === PHASE.SELECT) {
        st = p.gesture ? (MOVES[p.gesture].icon+' '+MOVES[p.gesture].name) : '🕐 待摆招';
        stCls = p.gesture!==null ? 'attack' : '';
      } else {
        st = '🎮';
      }
      if (p.combo.length >= COMBO_LEN) st = '✅ 锁定';
    } else if (p.active && !p.alive) { st='💀 出局'; }
    h.status.textContent = st;
    h.status.className = 'p-status '+stCls;
    // 技能卡（血条上方）：显示已选技能
    const locked = phase === PHASE.EXECUTE || phase === PHASE.BOSS_ATTACK || phase === PHASE.RESOLVE || p.combo.length >= COMBO_LEN;
    for (let i=0;i<h.moveCards.length;i++) {
      const card = h.moveCards[i];
      const mv = p.combo[i];
      const prevState = card.dataset.state;
      const filled = mv !== undefined;
      const newState = !filled ? 'empty' : (locked ? 'locked' : 'filled');
      if (prevState !== newState) {
        card.dataset.state = newState;
        const iconEl = card.querySelector('.mc-icon');
        const labelEl = card.querySelector('.mc-label');
        if (iconEl) iconEl.textContent = filled ? MOVE_ICONS[mv] : '';
        if (labelEl) labelEl.textContent = filled ? MOVES[mv].name : '未选';
        // 入场/锁定动画
        if (filled && newState === 'filled') {
          card.classList.remove('pop'); void card.offsetWidth; card.classList.add('pop');
        } else if (newState === 'locked') {
          card.classList.add('locking');
        }
      }
    }
  });
}

// ═══════════════════════════════════════════════════════════
//  Canvas 2D 叠加层（倒计时环、充能环、核心标记辅助）
// ═══════════════════════════════════════════════════════════
function project(pos3) {
  const v = pos3.clone().project(camera);
  return { x:(v.x+1)/2*innerWidth, y:(-v.y+1)/2*innerHeight, visible: v.z<1 };
}
function drawOverlay() {
  octx.clearRect(0,0,innerWidth,innerHeight);
  if (phase === PHASE.SELECT) drawSelectRing();
  if (phase === PHASE.BOSS_ATTACK) drawBossWarnRing();
}
function drawSelectRing() {
  const el = performance.now() - phaseStart;
  const remain = Math.max(0, (SELECT_MS-el)/1000);
  const frac = 1 - el/SELECT_MS;
  const r = 30;
  const x = innerWidth-70, y = innerHeight-130;
  octx.beginPath(); octx.arc(x,y,r,0,Math.PI*2); octx.strokeStyle='#ffffff33'; octx.lineWidth=6; octx.stroke();
  octx.beginPath(); octx.arc(x,y,r,-Math.PI/2,-Math.PI/2+Math.PI*2*frac); octx.strokeStyle='#4ec9ff'; octx.lineWidth=6; octx.stroke();
  octx.fillStyle='#fff'; octx.font='bold 18px sans-serif'; octx.textAlign='center'; octx.textBaseline='middle';
  octx.fillText(remain.toFixed(1), x, y);
}
function drawBossWarnRing() {
  const el = performance.now() - phaseStart;
  const remain = Math.max(0, (BOSS_WARN_MS-el)/1000);
  const frac = 1 - el/BOSS_WARN_MS;
  const r = 30;
  const x = innerWidth-70, y = innerHeight-130;
  octx.beginPath(); octx.arc(x,y,r,0,Math.PI*2); octx.strokeStyle='#ffffff33'; octx.lineWidth=6; octx.stroke();
  octx.beginPath(); octx.arc(x,y,r,-Math.PI/2,-Math.PI/2+Math.PI*2*frac); octx.strokeStyle='#ff6b6b'; octx.lineWidth=6; octx.stroke();
  octx.fillStyle='#fff'; octx.font='bold 18px sans-serif'; octx.textAlign='center'; octx.textBaseline='middle';
  octx.fillText(remain.toFixed(1), x, y);
}

// ═══════════════════════════════════════════════════════════
//  摄像头 / 启动
// ═══════════════════════════════════════════════════════════
async function setupCamera() {
  try {
    cameraVideo.muted = true;
    await startPoseCamera();
    cameraBtn.textContent = '🎥 摄像头已开启';
    cameraBtn.classList.add('active');
  } catch(e) {
    cameraBtn.textContent = '⚠️ 摄像头失败（演示模式运行）';
    console.warn('camera error', e);
    cameraActive = false;
    // 摄像头不可用：自动回退到演示模式，保证仍可游玩
    if (!DEMO) {
      DEMO = true;
      poseModelInfo = 'demo / fallback';
      setMessage('摄像头不可用，已切换为演示模式', true);
      if (demoHint) { demoHint.style.display = 'none'; }
    }
  }
}
function autoStartIfNeeded() {
  if (activeCount>0 && phase===PHASE.WAITING) {
    if (!DEMO && !cameraActive) return; // 非 demo 且无摄像头不自动开始
    startGame();
  }
}
cameraBtn.addEventListener('click', setupCamera);
// 无摄像头可用时自动启用演示模式，保证「开始游戏」始终可点
function enableDemoFallback() {
  if (DEMO) return;
  DEMO = true;
  poseModelInfo = 'demo / fallback';
  if (demoHint) demoHint.style.display = 'none';
}
startBtn.addEventListener('click', () => {
  // 摄像头可用：必须有人就位才可开始
  if (!DEMO && cameraActive) {
    if (activeCount === 0) { setMessage('请站到摄像头前，让上半身入镜', true); return; }
    startGame();
    return;
  }
  // 无摄像头：自动进入演示模式开始游玩，避免按钮无响应
  if (!DEMO) {
    enableDemoFallback();
    setMessage('未开启摄像头，已进入演示模式', true);
  }
  startGame();
});
window.addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  overlay.width = innerWidth; overlay.height = innerHeight;
});

// ═══════════════════════════════════════════════════════════
//  主循环
// ═══════════════════════════════════════════════════════════
overlay.width = innerWidth; overlay.height = innerHeight;
let lastTime = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now-lastTime)/1000);
  lastTime = now;

  if (DEMO) demoPoses();
  else if (!cameraActive) {
    // 无摄像头时也尝试提供基本骨架（忽略）
  }

  // 每玩家手势采集 + 实时位置匹配
  players.forEach(p => {
    if (p.active) {
      // 每次检测都根据人体位置重新匹配轨道，保证 avatar 始终位于轨道中心
      updatePlayerLaneFromPose(p);
    }
    if (p.active && p.alive) {
      if (p.lm) {
        const g = classifyGesture(p.lm);
        if (g !== null) {
          if (p.gesture !== g) { p.gesture = g; p.gestureHoldStart = now; }
        } else {
          p.gesture = null; p.gestureHoldStart = 0;
        }
        // 倾斜仅在 Boss 攻击阶段采样；其余阶段位置由 updatePlayerLaneFromPose 控制
        if (phase === PHASE.BOSS_ATTACK) p.lean = detectLean(p.lm);
      }
    }
  });

  // 状态机
  switch (phase) {
    case PHASE.WAITING:
      autoStartIfNeeded();
      break;
    case PHASE.SELECT: {
      players.forEach(p => { if (p.active && p.alive) tryConfirmGesture(p, now); });
      if (allLocked() || now - phaseStart >= SELECT_MS) finishSelect();
      break;
    }
    case PHASE.EXECUTE: updateExecute(dt, now); break;
    case PHASE.BOSS_ATTACK: updateBossAttack(dt, now); break;
    case PHASE.RESOLVE: updateResolve(dt, now); break;
    case PHASE.ROUND_END:
      if (now - phaseStart > ROUND_END_MS) startRound();
      break;
    case PHASE.VICTORY:
    case PHASE.GAMEOVER:
      break;
  }

  // 更新虚拟形象：必须在所有阶段（含 updateBossAttack）更新 p.lane 之后再调用，
  // 否则 BOSS_ATTACK 阶段 updateBossAttack 设置的 lane ±1 还没生效就被 updateAvatar 用旧值渲染
  players.forEach(p => { if (p.active) updateAvatar(p, dt); });

  updateThemeTransition(dt);
  updateBossMech(dt, now);
  updateHud();
  drawPoseDebug();
  updateFloats(dt);
  drawOverlay();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// 调试钩子：供自动化 playtest 检查内部状态
window.__game = () => ({
  phase,
  phaseStart,
  round,
  bossHp,
  DEMO,
  activeCount,
  bossDeathT: bossAnim.deathT,
  coreVisible: core.visible,
  players: players.map(p => ({ active:p.active, alive:p.alive, lane:p.lane, targetLane:p.targetLane, lean:p.lean, leanSmooth:p.leanSmooth, xSmooth:p.xSmooth, visible:p.avatar.group.visible, hp:p.hp, posX:p.avatar.group.position.x })),
  floats: floatPool.map(f => { const img = f.sprite.material.map ? f.sprite.material.map.image : null; return { text: (img && img.__text) || '?', texW: img?img.width:0, texH: img?img.height:0, scale: [f.sprite.scale.x, f.sprite.scale.y] }; }),
});
</script>
</body>
